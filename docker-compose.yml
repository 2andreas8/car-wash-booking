services:
  db:
    image: postgres:16
    container_name: carwash-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - carwash-data:/var/lib/postgresql/data

volumes:
  carwash-data:
